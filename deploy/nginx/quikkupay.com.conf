# nginx site for quikkupay.com, proxying to the Docker container on 127.0.0.1:3000.
#
#   sudo cp deploy/nginx/quikkupay.com.conf /etc/nginx/sites-available/quikkupay.com
#   sudo ln -s /etc/nginx/sites-available/quikkupay.com /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d quikkupay.com -d www.quikkupay.com
#   sudo nginx -t && sudo systemctl reload nginx
#
# No certificate yet? nginx won't load the 443 blocks until the files exist: enable only
# the port-80 block first, run certbot, then add the rest.
# nginx older than 1.25.1: replace "http2 on;" with "listen 443 ssl http2;".

# http -> https, on the bare domain
server {
    listen 80;
    listen [::]:80;
    server_name quikkupay.com www.quikkupay.com;

    # Let's Encrypt HTTP challenges (certbot renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://quikkupay.com$request_uri;
    }
}

# www -> bare domain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.quikkupay.com;

    ssl_certificate     /etc/letsencrypt/live/quikkupay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quikkupay.com/privkey.pem;

    return 301 https://quikkupay.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name quikkupay.com;

    ssl_certificate     /etc/letsencrypt/live/quikkupay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quikkupay.com/privkey.pem;

    # Security headers and static-file caching come from the Next.js server
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
