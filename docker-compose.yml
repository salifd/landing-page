# Quikku landing page: Next.js site + waitlist API in one container.
#
#   cp .env.example .env    # then fill in the Brevo settings
#   docker compose up -d --build
#
# The site listens on 127.0.0.1:3000 only; nginx on the host proxies the domain to it
# (see deploy/nginx/quikkupay.com.conf).

services:
  web:
    build: .
    image: quikku-landing
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
